{% extends "base.html" %}

{% block title %}لوحة المعلم{% endblock %}

{% block content %}
<div class="dashboard">
    <div class="dashboard__header">
        <h1 class="dashboard__title">لوحة المعلم</h1>
        <p class="dashboard__subtitle">إدارة الدورات والطلاب</p>
    </div>

    <div class="dashboard__grid">
        <div class="card">
            <div class="card__header"><h3>دوراتي</h3></div>
            <div class="card__body">
                <p class="stat">{{ courses | length }} دورة</p>
                <a href="/courses" class="btn btn--secondary">عرض الدورات</a>
            </div>
        </div>
        <div class="card">
            <div class="card__header"><h3>الطلاب</h3></div>
            <div class="card__body">
                <p class="stat">{{ students_count }} طالب</p>
            </div>
        </div>
        <div class="card">
            <div class="card__header"><h3>التقديمات</h3></div>
            <div class="card__body">
                <p class="stat">{{ submissions_count }} تقديم</p>
            </div>
        </div>
        <div class="card">
            <div class="card__header"><h3>تحليلات المهارات</h3></div>
            <div class="card__body">
                <a href="/instructor/skills" class="btn btn--primary">عرض التحليلات</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
