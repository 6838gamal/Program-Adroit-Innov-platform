{% extends "base.html" %}

{% block title %}تسجيل الدخول{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h1 class="auth-card__title">مرحباً بك</h1>
        <p class="auth-card__subtitle">سجّل الدخول للوصول إلى منصة تعلم البرمجة</p>
        <a href="/auth/login" class="btn btn--google">
            <span class="btn__icon">G</span>
            تسجيل الدخول بحساب Google
        </a>
        {% if error %}
        <p class="auth-card__error">{{ error }}</p>
        {% endif %}
    </div>
</div>
{% endblock %}
