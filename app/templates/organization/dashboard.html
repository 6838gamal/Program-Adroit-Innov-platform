{% extends "base.html" %}

{% block title %}إدارة المؤسسة{% endblock %}

{% block content %}
<div class="page">
    <h1 class="page__title">إدارة المؤسسة</h1>
    <div class="grid">
        <div class="card">
            <div class="card__header"><h3>الأعضاء</h3></div>
            <div class="card__body">
                <p class="stat">{{ members | length }} عضو</p>
                <a href="/organization/members" class="btn btn--secondary">إدارة الأعضاء</a>
            </div>
        </div>
        <div class="card">
            <div class="card__header"><h3>الدورات</h3></div>
            <div class="card__body">
                <p class="stat">{{ courses | length }} دورة</p>
            </div>
        </div>
        <div class="card">
            <div class="card__header"><h3>التحليلات</h3></div>
            <div class="card__body">
                <a href="/organization/analytics" class="btn btn--primary">عرض</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
