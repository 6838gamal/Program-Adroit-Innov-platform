{% extends "base.html" %}

{% block title %}إدارة المنصة{% endblock %}

{% block content %}
<div class="page">
    <h1 class="page__title">إدارة المنصة</h1>
    <div class="grid">
        <div class="card">
            <div class="card__header"><h3>المستخدمون</h3></div>
            <div class="card__body">
                <p class="stat">{{ users | length }} مستخدم</p>
                <a href="/admin/users" class="btn btn--secondary">إدارة</a>
            </div>
        </div>
        <div class="card">
            <div class="card__header"><h3>المؤسسات</h3></div>
            <div class="card__body">
                <p class="stat">{{ organizations | length }} مؤسسة</p>
                <a href="/admin/organizations" class="btn btn--secondary">إدارة</a>
            </div>
        </div>
        <div class="card">
            <div class="card__header"><h3>سجلات التدقيق</h3></div>
            <div class="card__body">
                <a href="/admin/audit-logs" class="btn btn--primary">عرض</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
